apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-platform-config
  namespace: default
metadata:
  labels:
    app: ml-platform
data:
  # Downstream infrastructure connectivity coordinates
  DATABASE_URL: "postgresql://ml_admin:ml_secure_password@postgres-service:5432/ml_workloads_db"
  REDIS_URL: "redis://redis-service:6379/0"
  RABBITMQ_URL: "amqp://mq_admin:mq_secure_password@rabbitmq-service:5672/"
  S3_ENDPOINT_URL: "http://minio-service:9000"
  ENV: "production"

---
# =====================================================================
# 1. API Serving Layer Deployment & ClusterIP Service
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-api
  namespace: default
spec:
  replicas: 2 # Horizontal redundancy out-of-the-box
  selector:
    matchLabels:
      component: api
  template:
    metadata:
      labels:
        component: api
    spec:
      containers:
      - name: api
        image: ml-workload-platform:latest # Reuses your multi-stage build image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ml-platform-config
        # Secure, non-root system identity mapping matching our Dockerfile profile
        securityContext:
          runAsUser: 8888
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 512Mi
        # Cluster health verification targets
        livenessProbe:
          httpGet:
            path: /docs # Standard FastAPI Swagger baseline endpoint
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ml-platform-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    component: api
  ports:
  - port: 8000
    targetPort: 8000

---
# =====================================================================
# 2. Outbox Relay / Publisher Deployment
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-outbox-publisher
  namespace: default
spec:
  replicas: 1 # Strictly 1 replica to prevent duplicate delivery polling collisions
  selector:
    matchLabels:
      component: outbox-publisher
  template:
    metadata:
      labels:
        component: outbox-publisher
    spec:
      containers:
      - name: outbox-publisher
        image: ml-workload-platform:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.outbox_relay"]
        envFrom:
        - configMapRef:
            name: ml-platform-config
        securityContext:
          runAsUser: 8888
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: "250m"
            memory: 256Mi

---
# =====================================================================
# 3. Decoupled Inference Worker Node Deployment
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-worker
  namespace: default
spec:
  replicas: 2 # Scale up or bind to a HorizontalPodAutoscaler (HPA) based on queue lag
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
      - name: inference-worker
        image: ml-workload-platform:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.worker"]
        envFrom:
        - configMapRef:
            name: ml-platform-config
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
            ://nvidia.com: "1" # Instructs K8s to schedule workloads on GPU instances
          requests:
            cpu: "1"
            memory: 2Gi
            ://nvidia.com: "1"
