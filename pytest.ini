[pytest]
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    positive: Core successful application path validation scripts.
    negative_and_boundary: Input checking error edge-case constraints.
    idempotent: Evaluating transaction tokens and concurrent locking structures.
    authentication: Security validation and access rate limit monitors.
    infrastructure: Downstream execution pools and async error handlers.
