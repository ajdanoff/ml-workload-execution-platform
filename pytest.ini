# pytest.ini
[pytest]
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers = 
  positive: Tests that cover successful creation of workloads.
  negative_and_boundary: Tests that cover workload creation failure due to schema definition or boundary violations.
  idempotent: Tests that can safely be run multiple times in sequence without side effects.
  authentication: Tests that cover various authorization (failure) scenarios.
  infrastructure: Tests that cover failures due to infrastructure and downstream.



