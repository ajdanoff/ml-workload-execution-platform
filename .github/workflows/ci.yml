name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
  
    steps:
    # 1. check-out the repository code
    - name: Checkout code
      uses: actions/checkout@v4
  
    # 2. set up python environment matching your target execution environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-key: '3.10'
        cache: 'pip' # automatically caches downloaded wheels to speed up future pipeline runs

    # 3. install core framework requirements along with test execution dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi\[standard\] pytest pytest-asyncio httpx pytest-mock
    
    # 4. execute the complete asynchronous test suite matrix
    - name: Run Pytest Suite
      run: |
        pytest -v -s
